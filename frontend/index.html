<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alejandria</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <main id="head">
        <h1>Alejandria</h1>
        <section>
    <h2>Add Book</h2>

    <form id="book-form">
        <div>
            <label for="title">Title:</label>
            <input
                type="text"
                id="title"
                name="title"
                required
            >
        </div>

        <div>
            <label for="author">Author:</label>
            <input
                type="text"
                id="author"
                name="author"
                required
            >
        </div>

        <button type="submit">Add Book</button>
    </form>

    <p id="form-message"></p>
</section>

        <section>
            <h2>Available Books</h2>

            <table>
                <thead>
                    <tr>
                        <th>Book<br>ID</th>
                        <th>Book<br>Title</th>
                        <th>Book<br>Author</th>
                    </tr>
                </thead>

                <tbody id="books-list">
                </tbody>
            </table>
        </section>
    </main>

    <script src="./js/app.js"></script>
</body>
</html>
